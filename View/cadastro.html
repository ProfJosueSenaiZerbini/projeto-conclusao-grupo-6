<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CYPHER - Cadastro</title>
     <link rel="stylesheet" href="./css/cadastro.css">
</head>


<body>

    <div class="pagina">


        <!-- ==============================
             CABEÇALHO
        ============================== -->

        <header>

            <div class="logo">
                CYPHER
            </div>

        </header>


        <!-- ==============================
             CONTEÚDO
        ============================== -->

        <main>

            <div class="conteudo">

                <!-- BARRA DE PROGRESSO -->

                <div class="progresso">

                    <div class="progresso-atual"></div>

                </div>


                <!-- TÍTULO -->

                <h1>
                    Selecione as categorias que te<br>
                    representam profissionalmente.
                </h1>

                <p class="descricao">
                    Fala pra gente como você contribui para a cena!!
                </p>


                <!-- ==============================
                     CATEGORIAS
                ============================== -->

                <div class="categorias">


                    <!-- RAPPER / MC -->

                    <div
                        class="categoria"
                        data-categoria="Rapper / MC"
                    >

                        <div class="icone"></div>

                        <span class="nome-categoria">
                            Rapper / MC
                        </span>

                    </div>


                    <!-- BEATMAKER -->

                    <div
                        class="categoria"
                        data-categoria="Beatmaker"
                    >

                        <div class="icone"></div>

                        <span class="nome-categoria">
                            Beatmaker
                        </span>

                    </div>


                    <!-- PRODUTOR -->

                    <div
                        class="categoria"
                        data-categoria="Produtor"
                    >

                        <div class="icone"></div>

                        <span class="nome-categoria">
                            Produtor
                        </span>

                    </div>


                    <!-- DJ -->

                    <div
                        class="categoria"
                        data-categoria="DJ"
                    >

                        <div class="icone"></div>

                        <span class="nome-categoria">
                            DJ
                        </span>

                    </div>


                    <!-- EMPRESÁRIO -->

                    <div
                        class="categoria"
                        data-categoria="Empresário"
                    >

                        <div class="icone"></div>

                        <span class="nome-categoria">
                            Empresário
                        </span>

                    </div>


                    <!-- ORGANIZADOR -->

                    <div
                        class="categoria"
                        data-categoria="Organizador de Evento"
                    >

                        <div class="icone"></div>

                        <span class="nome-categoria">
                            Organizador de<br>
                            Evento
                        </span>

                    </div>


                    <!-- PÚBLICO / FÃ -->

                    <div
                        class="categoria categoria-longa"
                        data-categoria="Público / Fã"
                    >

                        <div class="icone"></div>

                        <span class="nome-categoria">
                            Público / Fã
                        </span>

                    </div>


                </div>

            </div>

        </main>


        <!-- ==============================
             RODAPÉ
        ============================== -->

        <footer>

            <button
                class="btn btn-voltar"
                id="voltar"
            >
                Voltar
            </button>


            <button
                class="btn btn-continuar"
                id="continuar"
            >
                Continuar
            </button>

        </footer>


        <!-- MENSAGEM -->

        <div
            class="mensagem"
            id="mensagem"
        ></div>


    </div>


</body>

</html>
