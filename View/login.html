<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYPHER - Login</title>
    <link rel="stylesheet" href="/public/css/login.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header>
        <div class="logo">
            CYPHER
        </div>


    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
        <section class="login-card">
            <div class="login-content">
                <h1 class="title">CYPHER</h1>

                <div class="divider"></div>

                <!-- ÍCONE -->
                <div class="globe-container">
                    <div class="globe"></div>
                </div>

                <p class="subtitle">
                    Conectando as ruas ao mundo!
                </p>

                <!-- FORMULÁRIO -->
                <form id="loginForm">
                    <!-- EMAIL -->
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="cypher@exemplo.com" required>
                    </div>

                    <!-- SENHA -->
                    <div class="form-group">
                        <label for="password">Senha</label>
                        <div class="input-box">
                            <input type="password" id="password" class="password-input" placeholder="••••••••••"
                                required>
                            <button type="button" class="eye-button" id="eyeButton" title="Mostrar senha">
                                ◉
                            </button>
                        </div>
                    </div>

                    <!-- ENTRAR -->
                    <button type="submit" class="btn btn-login" id="entrar">
                        Entrar
                    </button>

                    <!-- CRIAR -->
                    <button type="button" class="btn btn-create" id="createButton">
                        Criar
                    </button>

                    <!-- ESQUECEU A SENHA -->
                    <a class="forgot" id="forgotButton">
                        Esqueceu a Senha?
                    </a>

                    <!-- OU -->
                    <div class="or-container">
                        <div class="or-line"></div>
                        <span class="or-text">ou</span>
                        <div class="or-line"></div>
                    </div>

                    <!-- CONVIDADO -->
                    <button type="button" class="guest-button" id="guestButton">
                        Continuar como convidado.
                    </button>

                    <!-- MENSAGEM -->
                    <p class="message" id="message"></p>
                </form>
            </div>

            </div>
        </section>
    </main>

    <script src="public/js/login-auth.js"></script>
</body>

</html>
